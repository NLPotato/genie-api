[tool.poetry]
name = "genie-api"
version = "0.1.0"
description = "Apis for LangChain & LangGraph-based Genie magic"
authors = ["wjlee <wjlee.ling@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11, <3.14"
langchain = "^0.3.14"
langchain-community = "^0.3.14"
langchain-openai = "^0.2.14"
langchain-anthropic = "^0.3.1"
langgraph = "^0.2.60"
langsmith = "^0.2.10"
langserve = "^0.3.1"
youtube-transcript-api = "^0.6.3"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
